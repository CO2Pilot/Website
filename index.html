<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reuse-able.build · Coming soon</title>
  <meta name="description" content="Closing data gaps to enable circular construction.">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=Inter:wght@400;500&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
  <style>
    /* Tokens from the reuse-able.build design system (tokens.json v2, 8 Nov 2026) */
    :root {
      --bg: #ffffff;
      --sand: #f7f7f7;
      --ink: #000000;
      --rule: #d6d6d6;
      --sage: #d2deba;
      --green: #56865f;
      --display: "Inter Tight", Arial, sans-serif;
      --sans: "Inter", Arial, sans-serif;
      --space-2: 12px;
      --space-4: 16px;
      --space-6: 28px;
      --radius-badge: 999px;
      --border-w: 1px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b211c;
        --sand: #283028;
        --ink: #ebe7da;
        --rule: #364036;
        --sage: #56664d;
        --green: #a8c49a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    /* Left: text */
    .text {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: var(--space-6);
      gap: var(--space-6);
    }
    /* Header and footer share one height, so the claim centres on the same line as the logo */
    .wordmark, footer { height: 28px; display: flex; align-items: center; }
    .wordmark {
      gap: 8px;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sage), var(--green));
    }
    .claim {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      max-width: 34rem;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(30px, 4.2vw, 44px);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: var(--space-4);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      letter-spacing: 0.06em;
      color: var(--ink);
      border: var(--border-w) solid var(--green);
      border-radius: var(--radius-badge);
      padding: 4px var(--space-2);
    }
    footer { font-size: 12px; line-height: 1.4; }

    /* Right: logo panel on the canvas ground */
    .panel {
      background: var(--sand);
      border-left: var(--border-w) solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }
    .logo { width: min(80%, 420px); height: auto; display: block; color: var(--ink); overflow: visible; }

    /* Phone: panel on top, text below */
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .panel { order: -1; border-left: 0; border-bottom: var(--border-w) solid var(--rule); min-height: 34vh; }
      .logo { width: min(80%, 300px); }
      .text { padding: var(--space-4); }
    }
  </style>
</head>
<body>
  <section class="text">
    <header class="wordmark"><span class="dot" aria-hidden="true"></span>reuse-able.build</header>
    <div class="claim">
      <h1>Closing data gaps to enable circular construction.</h1>
      <p class="badge">Coming soon</p>
    </div>
    <footer>© 2026 reuse-able.build</footer>
  </section>
  <aside class="panel">
    <!-- Logo rebuilt from 261030_Pitch-Deck.pptx, slide 2 (units: 1/1000 EMU, centred on the ring) -->
    <svg class="logo" viewBox="-1712 -896 3424 1792" role="img" aria-label="reuse-able.build">
      <defs>
        <mask id="ring-gap">
          <rect x="-1712" y="-896" width="3424" height="1792" fill="#fff"/>
          <rect x="-1712" y="-233" width="3424" height="466" fill="#000"/>
        </mask>
      </defs>
      <circle r="831" fill="none" stroke="var(--green)" stroke-width="127" mask="url(#ring-gap)"/>
      <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="290" fill="currentColor">REUSE-ABLE.BUILD</text>
    </svg>
  </aside>
</body>
</html>
